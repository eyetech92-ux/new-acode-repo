<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>QuickShop</h1>
    <div class="cart-status">
      🛒 Cart: <span id="cartCount">0</span> items ($<span id="cartTotal">0</span>)
    </div>
  </header>

  <main class="product-grid">
    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Phone">
      <h3>Smartphone</h3>
      <p class="price">$200</p>
      <button onclick="addToCart(200)">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Headphones">
      <h3>Wireless Headphones</h3>
      <p class="price">$50</p>
      <button onclick="addToCart(50)">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Smartwatch">
      <h3>Smartwatch</h3>
      <p class="price">$100</p>
      <button onclick="addToCart(100)">Add to Cart</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
